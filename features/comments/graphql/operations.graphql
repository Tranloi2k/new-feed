fragment CommentAuthor on User {
  id
  username
  fullName
  avatarUrl
}

# Every operation that can end up in the GetComments cache entry selects the
# same fields. When the mutation left out `replies`, writing its result into
# that entry failed with "Missing field 'replies'".
fragment CommentFields on Comment {
  id
  content
  createdAt
  user {
    ...CommentAuthor
  }
  replies {
    id
    content
    createdAt
    user {
      ...CommentAuthor
    }
  }
}

query GetComments($postId: Int!, $limit: Int, $cursor: Int) {
  getComments(postId: $postId, limit: $limit, cursor: $cursor) {
    comments {
      ...CommentFields
    }
    hasMore
    nextCursor
  }
}

mutation CreateComment($input: CreateCommentInput!) {
  createComment(input: $input) {
    success
    message
    comment {
      ...CommentFields
    }
  }
}

subscription CommentAdded($postId: Int!) {
  commentAdded(postId: $postId) {
    ...CommentFields
  }
}

subscription CommentDeleted($postId: Int!) {
  commentDeleted(postId: $postId)
}
